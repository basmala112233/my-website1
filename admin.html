<p class="subtitle">

</p>

<label>

<textarea id="description"

<input id="field1" placeholder="الطب">
</label>

المجال الثاني
<input id="field2" placeholder="البرمجة">
</label>

المجال الثالث
<input id="field3" placeholder="التداول">
</label>

</label>

<input id="color" type="color" value="#00d4aa">
</label>

<button id="save">

</button>

</div>

</div>


<script>

const SUPABASE_URL =
"https://yzalkwkbnxapiiseqraj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_McRUA7P1sOfa_x2LPxQB7A_kEmhJ-Vc";

const TABLE =
"site_content";

const API =
SUPABASE_URL +
"/rest/v1/" +
TABLE +
"?id=eq.1";


const headers = {

"apikey": SUPABASE_KEY,

"Authorization":
"Bearer " + SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

};


const fields = [

"name",
"roles",
"description",
"photo",
"field1",
"field2",
"field3",
"html_skill",
"js_skill",
"ui_skill",
"phone",
"whatsapp",
"color"

];


async function loadData(){

const message =
document.getElementById("message");

try{

message.textContent =
"جاري تحميل البيانات...";

const response =
await fetch(API,{
method:"GET",
headers:headers
});

if(!response.ok){

throw new Error(
await response.text()
);

}

const data =
await response.json();

if(!data.length){

message.textContent =
"⚠️ لا يوجد سجل id = 1 في قاعدة البيانات";

return;

}

const item =
data[0];

fields.forEach(field=>{

const input =
document.getElementById(field);

if(input){

input.value =
item[field] ?? "";

}

});

message.textContent =
"✅ تم تحميل البيانات";

setTimeout(()=>{
message.textContent="";
},2000);

}catch(error){

console.error(error);

message.textContent =
"❌ حدث خطأ في تحميل البيانات";

}

}


async function saveData(){

const message =
document.getElementById("message");

const data = {};

fields.forEach(field=>{

const input =
document.getElementById(field);

if(input){

data[field] =
input.value;

}

});


try{

message.textContent =
"جاري الحفظ...";

const response =
await fetch(API,{

method:"PATCH",

headers:headers,

body:
JSON.stringify(data)

});


if(!response.ok){

throw new Error(
await response.text()
);

}

message.textContent =
"✅ تم حفظ التعديلات بنجاح";

}catch(error){

console.error(error);

message.textContent =
"❌ فشل الحفظ: " +
error.message;

}

}


document
.getElementById("save")
.addEventListener(
"click",
saveData
);


loadData();

</script>

</body>
