```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم د. محمد علي</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:#05070b;
color:white;
padding:25px;
}
.container{
max-width:900px;
margin:auto;
}
h1{

}
p{

}

border-radius:15px;

}

}
input,textarea{

min-height:120px;

}
button{

}
button:hover{

}

margin-top:15px;
text-align:center;
color:#00d4aa;
}
</style>
</head>

<body>

<div class="container">

<h1>لوحة تحكم د. محمد علي</h1>
<p>عدّل بيانات الموقع واضغط حفظ.</p>

<div class="card">

<label>
الاسم
<input id="name">
</label>

<label>
المسمى
<input id="roles">
</label>

<label>
الوصف
<textarea id="description"></textarea>
</label>

<label>
رابط الصورة
<input id="photo">
</label>

<label>
المجال الأول
<input id="field1">
</label>

<label>
المجال الثاني
<input id="field2">
</label>

<label>
المجال الثالث
<input id="field3">
</label>

<label>
HTML / CSS %
<input id="html_skill" type="number" min="0" max="100">
</label>

<label>
JavaScript %
<input id="js_skill" type="number" min="0" max="100">
</label>

<label>
UI / UX %
<input id="ui_skill" type="number" min="0" max="100">
</label>

<label>
رقم الهاتف
<input id="phone">
</label>

<label>
رقم واتساب
<input id="whatsapp">
</label>

<label>
اللون الرئيسي
<input id="color" type="color">
</label>

<button id="save">حفظ التعديلات</button>

<div id="message"></div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://yzalkwkbnxapiiseqraj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_McRUA7P1sOfa_x2LPxQB7A_kEmhJ-Vc";

const API =
SUPABASE_URL + "/rest/v1/site_content?id=eq.1";


const headers = {
"apikey": SUPABASE_KEY,
"Authorization": "Bearer " + SUPABASE_KEY,
"Content-Type": "application/json"
};


const fields = [
"name",
"roles",
"description",
"photo",
"field1",
"field2",
"field3",
"html_skill",
"js_skill",
"ui_skill",
"phone",
"whatsapp",
"color"
];


async function loadData(){

try{

const response = await fetch(
SUPABASE_URL + "/rest/v1/site_content?id=eq.1",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
});

const data = await response.json();

if(!data.length){
document.getElementById("message").textContent =
"لم يتم العثور على البيانات";
return;
}

const item = data[0];

fields.forEach(field=>{

const input =
document.getElementById(field);

if(input && item[field] !== null){
input.value = item[field];
}

});

}catch(error){

document.getElementById("message").textContent =
"حدث خطأ في الاتصال بقاعدة البيانات";

console.error(error);

}

}


async function saveData(){

const data = {};

fields.forEach(field=>{

const input =
document.getElementById(field);

if(input){
data[field] = input.value;
}

});

try{

const response = await fetch(
API,
{
method:"PATCH",
headers:{
...headers,
"Prefer":"return=minimal"
},
body:JSON.stringify(data)
});

if(response.ok){

document.getElementById("message").textContent =
"✅ تم حفظ التعديلات بنجاح";

}else{

const error =
await response.text();

console.error(error);

document.getElementById("message").textContent =
"❌ حدث خطأ أثناء الحفظ";

}

}catch(error){

console.error(error);

document.getElementById("message").textContent =
"❌ لا يوجد اتصال بقاعدة البيانات";

}

}


document
.getElementById("save")
.addEventListener("click",saveData);


loadData();

</script>

</body>
</html>
